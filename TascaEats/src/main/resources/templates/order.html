<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">

    <h2>🍽️ TascaEats — Order</h2>
    <hr>

    <a href="/restaurant" class="btn btn-outline-secondary btn-sm mb-3">← Back to Restaurants</a>

    <form method="get" th:action="@{/order}">
        <div class="mb-3 d-flex flex-wrap gap-3">
            <label><input type="checkbox" class="filter-toggle" data-target="f-designation"
                th:checked="${designation != null and !designation.isEmpty()}"> Name</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-description"
                th:checked="${description != null and !description.isEmpty()}"> Description</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-availability"
                th:checked="${availability != null and !availability.isEmpty()}"> Availability</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-timesOrdered"
                th:checked="${timesOrdered != null and !timesOrdered.isEmpty()}"> Times Ordered</label>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-auto" th:classappend="${designation == null or designation.isEmpty()} ? 'd-none'" id="f-designation">
                <input type="text" name="designation" class="form-control" placeholder="Name" th:value="${designation}"/>
            </div>
            <div class="col-auto" th:classappend="${description == null or description.isEmpty()} ? 'd-none'" id="f-description">
                <input type="text" name="description" class="form-control" placeholder="Description" th:value="${description}"/>
            </div>
            <div class="col-auto" th:classappend="${availability == null or availability.isEmpty()} ? 'd-none'" id="f-availability">
                <select name="availability" class="form-select">
                    <option value="">All</option>
                    <option value="AVAILABLE" th:selected="${availability == 'AVAILABLE'}">Available</option>
                    <option value="UNAVAILABLE" th:selected="${availability == 'UNAVAILABLE'}">Sold Out</option>
                </select>
            </div>
            <div class="col-auto" th:classappend="${timesOrdered == null or timesOrdered.isEmpty()} ? 'd-none'" id="f-timesOrdered">
                <input type="number" name="timesOrdered" class="form-control" placeholder="Min times ordered" th:value="${timesOrdered}"/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary mb-4">Search</button>
    </form>

    <!-- Produtos -->
    <p class="text-muted small mb-3" th:if="${products != null}">
        <span th:text="${#lists.size(products)}">0</span> product(s) found
    </p>

    <form method="post" th:action="@{/order}">
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-4" th:if="${products != null and not #lists.isEmpty(products)}">
            <div class="col" th:each="p : ${products}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0" th:text="${p.designation}">Name</h5>
                            <span class="badge"
                                  th:classappend="${p.status == 'AVAILABLE'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${p.status == 'AVAILABLE'} ? 'Available' : 'Sold Out'">
                            </span>
                        </div>
                        <p class="card-text text-muted small" th:text="${p.description}"></p>
                        <p class="card-text fw-semibold" th:text="${p.price + ' €'}"></p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="productIds" th:value="${p.id}">
                            <label class="form-check-label">Add to order</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p th:if="${products == null or #lists.isEmpty(products)}" class="text-muted">No products found.</p>

        <!-- Morada -->
        <h5 class="mt-4">Delivery Address</h5>
        <hr>
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" placeholder="City" required/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Street</label>
                <input type="text" name="street" class="form-control" placeholder="Street" required/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Postal Code</label>
                <input type="text" name="postalCode" class="form-control" placeholder="Postal Code" required/>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Create Order</button>
    </form>
    </div>

    <script>
    document.querySelectorAll('.filter-toggle').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var target = document.getElementById(this.dataset.target);
            if (this.checked) {
                target.classList.remove('d-none');
            } else {
                target.classList.add('d-none');
                target.querySelector('input').value = '';
            }
        });
    });
</script>
</body>
</html>
