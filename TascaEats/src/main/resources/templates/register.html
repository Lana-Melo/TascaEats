<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="card" style="width: 400px; margin: 100px auto;">
    <div class="card-body">
      <h5 class="card-title">🍽️ TascaEats — Register</h5>

      <div th:if="${error}" th:text="${error}"></div>
      <div th:if="${message}" th:text="${message}"></div>

      <form action="/register" method="post">
        <label>Username:</label>
        <input type="text" name="username" required autofocus /><br>

        <label>Password:</label>
        <input type="password" name="password" required /><br>

        <label>Name:</label>
        <input type="text" name="name" required /><br>

        <label>Phone-number:</label>
        <input type="number" name="phoneNumber" required /><br>

        <label>Nif:</label>
        <input type="number" name="nif" required /><br>

        <label>City:</label>
        <input type="text" name="city" required /><br>

        <label>Street:</label>
        <input type="text" name="street" required /><br>

        <label>Postal-Code:</label>
        <input type="text" name="postalCode" required /><br>

        <button type="submit" class="btn btn-primary">Create</button>
      </form>
    </div>
  </div>

</body>
</html>
