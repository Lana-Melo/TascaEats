<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">

  <div class="card shadow-lg p-4" style="width: 450px; border-radius: 15px;">

    <h4 class="text-center mb-3">Create Account</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form action="/register" method="post">

      <input type="text" name="username" class="form-control mb-2" placeholder="Username" required autofocus />
      <input type="password" name="password" class="form-control mb-2" placeholder="Password" required />

      <input type="text" name="name" class="form-control mb-2" placeholder="Full name" required />

      <input type="number" name="phoneNumber" class="form-control mb-2" placeholder="Phone number" required />
      <input type="number" name="nif" class="form-control mb-2" placeholder="NIF" required />

      <input type="text" name="city" class="form-control mb-2" placeholder="City" required />
      <input type="text" name="street" class="form-control mb-2" placeholder="Street" required />
      <input type="text" name="postalCode" class="form-control mb-3" placeholder="Postal code" required />

      <button type="submit" class="btn btn-primary w-100">
        Create Account
      </button>

    </form>

    <p class="text-center mt-3">
      Already have an account? <a href="/login">Login</a>
    </p>

  </div>

</div>

</body>
</html>
