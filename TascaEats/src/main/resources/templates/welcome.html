<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg p-4 text-center" style="width: 420px; border-radius: 15px;">

    <h4 class="mb-3">
      Welcome, <span th:text="${username}"></span>
    </h4>

    <!-- CLIENT -->
    <div th:if="${userRole == 'CLIENT'}">
      <p class="text-muted mb-4">What would you like to do?</p>

      <div class="d-grid gap-3">
        <a href="/restaurant" class="btn btn-primary btn-lg">
        🍽️ Browse Restaurants
        </a>

        <a href="/order" class="btn btn-primary btn-lg">
        📦 My Orders
        </a>

        <a href="/profile" class="btn btn-primary btn-lg">
        Update Profile
        </a>

        <a th:href="@{/logout}" class="text-decoration-underline">
        Logout
        </a>
      </div>
    </div>

    <!-- NON CLIENT -->
    <div th:if="${userRole != 'CLIENT'}">
      <div class="alert alert-warning mt-3">
        You are not a client.
      </div>

      <p class="text-muted">Please use the internal application.</p>


        <a th:href="@{/logout}" class="text-decoration-underline">
        Logout
        </a>
    </div>

  </div>
</div>

</body>
</html>
