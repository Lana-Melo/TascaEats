<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurants — TascaEats</title>    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/restaurant">🍽️ TascaEats</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="/restaurant">Restaurants</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/order">My Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>Restaurants</h2>
    <hr>
    <form method="get" th:action="@{/restaurant}">

        <div class="mb-3 d-flex flex-wrap gap-3">
            <label><input type="checkbox" class="filter-toggle" data-target="f-designation"
                th:checked="${designation != null and !designation.isEmpty()}"> Name</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-city"
                th:checked="${city != null and !city.isEmpty()}"> City</label>
                <label><input type="checkbox" class="filter-toggle" data-target="f-street"
            th:checked="${street != null and !street.isEmpty()}"> Street</label>
                <label><input type="checkbox" class="filter-toggle" data-target="f-postalCode"
            th:checked="${postalCode != null and !postalCode.isEmpty()}"> Postal Code</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-cuisine"
                th:checked="${cuisine != null and !cuisine.isEmpty()}"> Cuisine</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-orderNumber"
                th:checked="${orderNumber != null and !orderNumber.isEmpty()}"> Min Orders</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-reviewNumber"
                th:checked="${reviewNumber != null and !reviewNumber.isEmpty()}"> Min Reviews</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-activeHour"
                th:checked="${activeHour != null and !activeHour.isEmpty()}"> Active at</label>
            <label><input type="checkbox" class="filter-toggle" data-target="f-average"
                th:checked="${average != null and !average.isEmpty()}"> Max Avg Price</label>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-auto" th:classappend="${designation == null or designation.isEmpty()} ? 'd-none'" id="f-designation">
                <input type="text" name="designation" class="form-control" placeholder="Name" th:value="${designation}"/>
            </div>
            <div class="col-auto" th:classappend="${city == null or city.isEmpty()} ? 'd-none'" id="f-city">
                <input type="text" name="city" class="form-control" placeholder="City" th:value="${city}"/>
            </div>
                        <div class="col-auto" th:classappend="${street == null or street.isEmpty()} ? 'd-none'" id="f-street">
                <input type="text" name="street" class="form-control" placeholder="Street" th:value="${street}"/>
            </div>
                        <div class="col-auto" th:classappend="${postalCode == null or postalCode.isEmpty()} ? 'd-none'" id="f-postalCode">
                <input type="text" name="postalCode" class="form-control" placeholder="Postal Code" th:value="${postalCode}"/>
            </div>
            <div class="col-auto" th:classappend="${cuisine == null or cuisine.isEmpty()} ? 'd-none'" id="f-cuisine">
                <input type="text" name="cuisine" class="form-control" placeholder="Cuisine" th:value="${cuisine}"/>
            </div>
            <div class="col-auto" th:classappend="${orderNumber == null or orderNumber.isEmpty()} ? 'd-none'" id="f-orderNumber">
                <input type="number" name="orderNumber" class="form-control" placeholder="Min orders" th:value="${orderNumber}"/>
            </div>
            <div class="col-auto" th:classappend="${reviewNumber == null or reviewNumber.isEmpty()} ? 'd-none'" id="f-reviewNumber">
                <input type="number" name="reviewNumber" class="form-control" placeholder="Min reviews" th:value="${reviewNumber}"/>
            </div>
            <div class="col-auto" th:classappend="${activeHour == null or activeHour.isEmpty()} ? 'd-none'" id="f-activeHour">
                <input type="time" name="activeHour" class="form-control" th:value="${activeHour}"/>
            </div>
            <div class="col-auto" th:classappend="${average == null or average.isEmpty()} ? 'd-none'" id="f-average">
                <input type="number" step="0.01" name="average" class="form-control" placeholder="Max avg price" th:value="${average}"/>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mb-4">Search</button>
    </form>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <p class="text-muted small mb-3" th:if="${restaurant != null}">
        <span th:text="${#lists.size(restaurant)}">0</span> restaurant(s) found
    </p>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${restaurant != null and not #lists.isEmpty(restaurant)}">
        <div class="col" th:each="r : ${restaurant}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${r.designation}">Name</h5>
                        <span class="badge"
                              th:classappend="${r.status == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${r.status == 'OPEN'} ? 'Open' : 'Closed'">
                        </span>
                    </div>
                    <p class="card-text text-muted small mb-1">
                        📍 <span th:text="${r.street + ', ' + r.city + ' ' + r.postalCode}"></span>
                    </p>
                    <p class="card-text text-muted small mb-1">
                        ⭐ <span th:text="${r.averageRating > 0} ? ${r.averageRating + ' (' + r.reviewCount + ' reviews)'} : 'No reviews'"></span>
                    </p>
                    <p class="card-text text-muted small">
                        👤 <span th:text="${r.adminName}"></span>
                    </p>
                </div>
                <div class="card-footer bg-transparent  d-grid gap-2">
                    <a th:href="@{/restaurant/{id}/product(id=${r.id})}" class="btn btn-outline-primary btn-sm w-100">View Products</a>
                <button type="button"
                        class="btn btn-light border btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#reviewModal' + ${r.id}">
                    ⭐ Review
                </button>
                </div>
                <div class="modal fade" th:id="'reviewModal' + ${r.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">

                        <form th:action="@{/restaurant/{id}/review(id=${r.id})}" method="post">

                            <div class="modal-header">
                            <h5 class="modal-title">Review Restaurant</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">

                            <div class="mb-3">
                                <label>Rating (1-5)</label>
                                <input type="number" name="rating" min="1" max="5" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label>Comment</label>
                                <textarea name="comment" class="form-control"></textarea>
                            </div>

                            </div>

                            <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Submit Review</button>
                            </div>

                        </form>

                        </div>
                    </div>
                    </div>
            </div>
        </div>
    </div>

    <p th:if="${restaurant != null and #lists.isEmpty(restaurant)}" class="text-muted">No restaurants found.</p>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.filter-toggle').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var target = document.getElementById(this.dataset.target);
            if (this.checked) {
                target.classList.remove('d-none');
            } else {
                target.classList.add('d-none');
                target.querySelector('input').value = '';
            }
        });
    });
</script>

</body>
</html>
