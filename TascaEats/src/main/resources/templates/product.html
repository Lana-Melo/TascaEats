<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <a href="/restaurant" class="btn btn-outline-secondary btn-sm mb-3">← Back to Restaurants</a>

    <h2>🍽️ Products</h2>
    <hr>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <p class="text-muted small mb-3" th:if="${products != null}">
        <span th:text="${#lists.size(products)}">0</span> product(s) found
    </p>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${product != null and not #lists.isEmpty(product)}">
        <div class="col" th:each="p : ${product}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${p.designation}">Name</h5>
                        <span class="badge"
                              th:classappend="${p.availability == 'AVAILABLE'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${p.availability == 'AVAILABLE'} ? 'Available' : 'Sold Out'">
                        </span>
                    </div>
                    <p class="card-text text-muted small" th:text="${p.description}"></p>
                    <p class="card-text fw-semibold" th:text="${p.price + ' €'}"></p>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${product != null and #lists.isEmpty(product)}" class="text-muted">No products found.</p>

</div>
</body>
</html>
