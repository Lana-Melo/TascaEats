<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
<div class="container">
    <a class="navbar-brand" href="/restaurant">🍽️ TascaEats</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="/profile">Update Profile</a>
                </li>
            <li class="nav-item">
                <a class="nav-link" href="/restaurant">Restaurants</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/order">My Orders</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/logout">Logout</a>
            </li>
        </ul>
    </div>
</div>
</nav>

<div class="container mt-4">

    <a href="/restaurant" class="btn btn-outline-secondary btn-sm mb-3">← Back</a>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Orders</h2>
        <a href="/order?newOrder=true" class="btn btn-primary">+ New Order</a>
    </div>
    <hr>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Lista de orders -->
    <div th:if="${newOrder == null}">
        <p class="text-muted small mb-3" th:if="${orders != null}">
            <span th:text="${#lists.size(orders)}">0</span> order(s) found
        </p>

        <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${orders != null and not #lists.isEmpty(orders)}">
            <div class="col" th:each="o : ${orders}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0">Order #<span th:text="${o.id}"></span></h5>
                            <span class="badge"
                                  th:classappend="${o.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                  (${o.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                  th:text="${o.status}">
                            </span>
                        </div>
                        <p class="card-text text-muted small mb-1">
                            📍 <span th:text="${o.street + ', ' + o.city + ' ' + o.postalCode}"></span>
                        </p>
                        <p class="card-text text-muted small mb-1">
                            🕐 <span th:text="${o.timestamp}"></span>
                        </p>
                        <p class="card-text fw-semibold" th:text="${o.totalValue + ' €'}"></p>
                    </div>
                    <div class="card-footer bg-transparent" th:if="${o.status.name() != 'CANCELLED' and o.status.name() != 'DELIVERED'}">
                        <form th:action="@{/order/{id}/cancel(id=${o.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">Cancel Order</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <p th:if="${orders != null and #lists.isEmpty(orders)}" class="text-muted">No orders yet.</p>
    </div>

    <!-- Nova order -->
    <div th:if="${newOrder != null}">
        <h4>New Order</h4>
        <hr>

        <form method="post" th:action="@{/order}" id="order-form">

            <!-- Morada de entrega -->
            <h6>Delivery Address</h6>

            <!-- Moradas guardadas -->
            <div class="mb-2">
                <div th:each="a, iter : ${clientAddresses}" class="form-check">
                    <input class="form-check-input" type="radio" name="savedAddress"
                        th:value="${a.street() + '|' + a.city() + '|' + a.postalCode()}"
                        th:id="'addr-' + ${iter.index}"
                        onchange="fillAddress(this.value)">
                    <label class="form-check-label" th:for="'addr-' + ${iter.index}"
                        th:text="${a.street() + ', ' + a.city() + ' ' + a.postalCode()}"></label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="savedAddress"
                        value="new" id="addr-new" onchange="fillAddress('new')">
                    <label class="form-check-label" for="addr-new">New address</label>
                </div>
            </div>

            <!-- Campos de morada — escondidos por defeito -->
            <div id="address-fields" class="row g-2 mb-3 d-none">
                <div class="col-md-4">
                    <input type="text" name="street" id="field-street" class="form-control" placeholder="Street" required="true"/>
                </div>
                <div class="col-md-4">
                    <input type="text" name="city" id="field-city" class="form-control" placeholder="City" required="true"/>
                </div>
                <div class="col-md-4">
                    <input type="text" name="postalCode" id="field-postalCode" class="form-control" placeholder="Postal Code" required="true"/>
                </div>
            </div>

            <script>
            function fillAddress(val) {
                const fields = document.getElementById('address-fields');
                if (val === 'new') {
                    fields.classList.remove('d-none');
                    document.getElementById('field-street').value = '';
                    document.getElementById('field-city').value = '';
                    document.getElementById('field-postalCode').value = '';
                } else {
                    const [street, city, postalCode] = val.split('|');
                    document.getElementById('field-street').value = street;
                    document.getElementById('field-city').value = city;
                    document.getElementById('field-postalCode').value = postalCode;
                    fields.classList.add('d-none');
                }
            }
            </script>

            <!-- Filtros de produtos -->
            <h6>Select Products</h6>
            <div class="mb-3 d-flex flex-wrap gap-3">
                <label><input type="checkbox" class="filter-toggle" data-target="f-designation"
                    th:checked="${designation != null and !designation.isEmpty()}"> Name</label>
                <label><input type="checkbox" class="filter-toggle" data-target="f-description"
                    th:checked="${description != null and !description.isEmpty()}"> Description</label>
                <label><input type="checkbox" class="filter-toggle" data-target="f-price"
                    th:checked="${price != null and !price.isEmpty()}"> Max Price</label>
                <label><input type="checkbox" class="filter-toggle" data-target="f-timesOrdered"
                    th:checked="${timesOrdered != null and !timesOrdered.isEmpty()}"> Times Ordered</label>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-auto" th:classappend="${designation == null or designation.isEmpty()} ? 'd-none'" id="f-designation">
                    <input type="text" name="designation" class="form-control" placeholder="Name" th:value="${designation}"/>
                </div>
                <div class="col-auto" th:classappend="${description == null or description.isEmpty()} ? 'd-none'" id="f-description">
                    <input type="text" name="description" class="form-control" placeholder="Description" th:value="${description}"/>
                </div>
                <div class="col-auto" th:classappend="${price == null or price.isEmpty()} ? 'd-none'" id="f-price">
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="Max price (€)" th:value="${price}"/>
                </div>
                <div class="col-auto" th:classappend="${timesOrdered == null or timesOrdered.isEmpty()} ? 'd-none'" id="f-timesOrdered">
                    <input type="number" name="timesOrdered" class="form-control" placeholder="Min times ordered" th:value="${timesOrdered}"/>
                </div>
            </div>

            <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="updateSearch()">Search</button>
            <script>
            function updateSearch() {
                const params = new URLSearchParams();
                params.set('newOrder', 'true');
                document.querySelectorAll('[name=designation], [name=description], [name=price], [name=timesOrdered]').forEach(el => {
                    if (el.value) params.set(el.name, el.value);
                });
                window.location.href = '/order?' + params.toString();
            }
            </script>

            <!-- Lista de produtos com checkbox -->
            <div class="row row-cols-1 row-cols-md-3 g-3 mb-4" th:if="${products != null and not #lists.isEmpty(products)}">
                <div class="col" th:each="p : ${products}">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="productIds"
                                       th:value="${p.id}"
                                       th:disabled="${p.availability != 'AVAILABLE'}"
                                       th:id="'p-' + ${p.id}"/>
                                <label class="form-check-label fw-semibold" th:for="'p-' + ${p.id}" th:text="${p.designation}"></label>
                            </div>
                            <p class="card-text text-muted small mt-1" th:text="${p.description}"></p>
                            <p class="card-text fw-semibold" th:text="${p.price + ' €'}"></p>
                            <span class="badge"
                                  th:classappend="${p.availability == 'AVAILABLE'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${p.availability == 'AVAILABLE'} ? 'Available' : 'Sold Out'">
                            </span>
                        </div>
                    </div>
                </div>
            </div>



            <button type="submit" class="btn btn-primary">Create Order</button>
            <a href="/order" class="btn btn-outline-secondary ms-2">Cancel</a>

        </form>
    </div>

</div>

<script>
    document.querySelectorAll('.filter-toggle').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var target = document.getElementById(this.dataset.target);
            if (this.checked) {
                target.classList.remove('d-none');
            } else {
                target.classList.add('d-none');
                var input = target.querySelector('input, select');
                if (input) input.value = '';
            }
        });
    });
</script>

</body>
</html>
