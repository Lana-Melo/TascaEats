<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — TascaEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

    <h4 class="mb-3 text-center">🍽️ TascaEats Login</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form action="/login" method="post">
      <input type="text" name="username" class="form-control mb-3" placeholder="Username" required autofocus />
      <input type="password" name="password" class="form-control mb-3" placeholder="Password" required />

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-3">
      No account? <a href="/register">Register</a>
    </p>

  </div>
</div>

</body>
</html>
