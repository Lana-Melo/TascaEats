syntax = "proto3";

package tascaeats;

option java_package = "pt.ul.fc.css.tascaeats.grpc";
option java_multiple_files = true;
option java_outer_classname = "TascaEatsProto";

service TascaEatsService {

  rpc Login (LoginRequest) returns (UserResponse);
  rpc RegisterAdmin (RegisterRequest) returns (UserResponse);
  rpc RegisterDeliveryPerson (RegisterRequest) returns (DeliveryPersonResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (Empty);
}

message Empty {}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string phoneNumber = 4;
  string nif = 5;
  string role = 6; // este campo só tem utilidade para o caso do login
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string name = 3;
  string phoneNumber = 4;
  string nif = 5;
}

message DeliveryPersonResponse {
  int64 id = 1;
  string username = 2;
  string password = 3;
  string name = 4;
  string phoneNumber = 5;
  string nif = 6;
  string status = 7;
}

message DeleteAccountRequest {
  int64 id = 1;
}
