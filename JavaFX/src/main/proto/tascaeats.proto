syntax = "proto3";

package tascaeats;

option java_package = "pt.ul.fc.css.tascaeats.grpc";
option java_multiple_files = true;
option java_outer_classname = "TascaEatsProto";

service TascaEatsService {

  rpc Login (LoginRequest) returns (UserResponse);
  rpc RegisterAdmin (UserRequest) returns (UserResponse);
  rpc RegisterDeliveryPerson (UserRequest) returns (DeliveryPersonResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (Empty);
  rpc UpdateAdmin (UserRequest) returns (UserResponse);
  rpc UpdateClient (UserRequest) returns (UserResponse);
  rpc UpdateDeliveryPerson (DeliveryPersonUpdateRequest) returns (DeliveryPersonResponse);
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);
  rpc SearchAdminRestaurants (AdminRestaurantsRequest) returns (AdminRestaurantsResponse);
  rpc GetAllMenus (Empty) returns (MenusResponse);
  rpc AssignMenu (AssignMenuRequest) returns (Empty);
  rpc ChangeRestaurantStatus (ChangeStatusRequest) returns (Empty);
}

message AdminRestaurantsRequest {
  int64 adminId = 1;
  string name = 2;
  string city = 3;
  string street = 4;
  string postalCode = 5;
  string cuisine = 6;
  string minOrders = 7;
  string minReviews = 8;
  string activeAt = 9;
  string maxAvgPrice = 10;
}

message RestaurantItem {
  int64 id = 1;
  string designation = 2;
  string status = 3;
  string nif = 4;
  string street = 5;
  string city = 6;
  string postalCode = 7;
  string openHours = 8;
  string closeHours = 9;
}

message AdminRestaurantsResponse {
  repeated RestaurantItem restaurants = 1;
}

message Empty {}

message MenuItemMessage {
  int64 id = 1;
  string name = 2;
  string cuisine = 3;
  string description = 4;
  repeated int64 productIds = 5;
}

message MenusResponse {
  repeated MenuItemMessage menus = 1;
}

message AssignMenuRequest {
  int64 restaurantId = 1;
  int64 menuId = 2;
}

message ChangeStatusRequest {
  int64 restaurantId = 1;
  string status = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string phoneNumber = 4;
  string nif = 5;
  string role = 6; // este campo só tem utilidade para o caso do login
}

message UserRequest {
  int64 id = 1;
  string username = 2;
  string password = 3;
  string name = 4;
  string phoneNumber = 5;
  string nif = 6;
}

message DeliveryPersonUpdateRequest {
  int64 id = 1;
  string username = 2;
  string password = 3;
  string name = 4;
  string phoneNumber = 5;
  string nif = 6;
  string status = 7;
}

message DeliveryPersonResponse {
  int64 id = 1;
  string username = 2;
  string password = 3;
  string name = 4;
  string phoneNumber = 5;
  string nif = 6;
  string status = 7;
}

message DeleteAccountRequest {
  int64 id = 1;
}

message SearchUsersRequest {
  string name = 1;
  string userType = 2;
  string orderNumber = 3;
  string deliveryNumber = 4;
}

message SearchUsersResponse {
  repeated UserResponse users = 1;
}
