version: "3.8"

services:

  # ---- nginx --------------------------------------------------------------------
  nginx:
    container_name: nginx
    image: nginx:1.30-trixie
    ports:
      - "80:80"
      - "9090:9090"   # gRPC do JavaFX
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - monolito
      - order-service
    restart: unless-stopped
    networks:
      - tascanet

  # ---- monolito --------------------------------------------------------------------
  monolito:
    build:
      context: ./TascaEats
      dockerfile: Dockerfile
    container_name: monolito
    restart: unless-stopped
    expose:
      - 8080
      - 9090
    depends_on:
      - pgserver
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgserver:5432/postgres
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - tascanet

  # ----- order micro ----------------------------------------------------------------
  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    expose:
      - 8085
    depends_on:
      - pgserver-order
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgserver-order:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8085
    networks:
      - tascanet

  # ------ bd monolito ----------------------------------------------------------------
  pgserver:
    build:
      context: ./TascaEats
      dockerfile: postgres.dockerfile
    container_name: pgserver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - 5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    restart: unless-stopped
    networks:
      - tascanet

  # ------ bd order micro ----------------------------------------------------------------
  pgserver-order:
    image: postgres:15.1-alpine
    container_name: pgserver-order
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    expose:
      - 5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=orderdb
    restart: unless-stopped
    networks:
      - tascanet

  # ---- kakfa --------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.2-rc1
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "9092:9092"
    networks:
      - tascanet

volumes:
  postgres-data:
  postgres-order-data:

networks:
  tascanet:
    driver: bridge
