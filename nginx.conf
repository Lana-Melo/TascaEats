worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream monolito-http {
        server monolito:8084;
    }

    upstream monolito-grpc {
        server monolito:9090;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://monolito-http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 9090;
        http2 on;

        location / {
            grpc_pass grpc://monolito-grpc;
        }
    }

}
