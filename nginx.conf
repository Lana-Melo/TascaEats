worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream monolito {
        server monolito:8080;
    }

    upstream delivery_service {
        server delivery-service:8085;
    }


    server {
        listen 80;
        server_name localhost;

        location /api/deliveryPersons/ {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/delivery/ {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://monolito;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 9090 http2;

        location / {
            grpc_pass grpc://monolito:9090;
        }
    }

}
